[package]
name = "simbiguity"
description = "An open source simulation engine by The Ambiguity Project: simulation, animation and 3D rendering for education."
readme = "../../README.md"
keywords = ["simulation", "physics", "circuits", "animation", "education"]
categories = ["simulation", "science", "no-std"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = ["math", "core"]
math = ["dep:simbiguity-math"]
core = ["dep:simbiguity-core", "math"]
std = ["simbiguity-math?/std", "simbiguity-core?/std"]

[dependencies]
simbiguity-math = { path = "../simbiguity-math", version = "0.0.1", optional = true }
simbiguity-core = { path = "../simbiguity-core", version = "0.0.1", optional = true }
