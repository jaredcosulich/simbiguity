# Pins the Rust toolchain for local development, cloud VMs and CI from one file.
#
# rustup reads this before any default toolchain, so every machine compiles with
# the same rustc/clippy and installs what the build needs on first use:
#   - wasm32-unknown-unknown: the demos compile the engines to WebAssembly.
#   - rustfmt / clippy: the static checks (`cargo fmt --check`, `clippy -D warnings`).
#   - llvm-tools-preview: required by `cargo llvm-cov` for coverage.
#
# To upgrade, bump `channel` and fix any new clippy findings in the same commit.
[toolchain]
channel = "1.99.0"
targets = ["wasm32-unknown-unknown"]
components = ["rustfmt", "clippy", "llvm-tools-preview"]
