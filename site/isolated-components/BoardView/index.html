<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Isolated BoardView</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #333; }
    #codeyam-capture { width: 600px; height: 400px; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="codeyam-capture">
    <canvas id="board-canvas"></canvas>
  </div>
  <script type="module">
    import { BoardView } from "../../demos/circuit-lab/components/board-view.js";
    import { EXPERIMENTS } from "../../demos/circuit-lab/experiments.js";

    async function init() {
      const view = new BoardView("board-canvas");
      await view.init();
      
      const s = new URLSearchParams(window.location.search).get("s");
      let expName = "led";
      if (s === "Rectifier") expName = "rectifier";
      else if (s === "Resonance") expName = "rlc";
      
      if (EXPERIMENTS[expName]) {
        view.loadLayout(EXPERIMENTS[expName].setup({}));
        view.renderFrame(0);
      }
    }
    init().catch(console.error);
  </script>
</body>
</html>
