<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Physics Engine - Simbiguity</title>
  <style>
    #chart { width: 100%; height: 200px; background: #eee; margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Physics Engine</h1>
    <a href="/">Back to home</a>
  </header>
  <main>
    <div id="canvas-container">
      <canvas id="view" width="640" height="400"></canvas>
    </div>
    <div id="controls">
      <label>Preset:
        <select id="preset">
          <option value="pendulum">Pendulum</option>
          <option value="spring">Spring-mass</option>
          <option value="projectile">Projectile</option>
          <option value="chain">Chain</option>
        </select>
      </label>
      <label>Integrator:
        <select id="integrator">
          <option value="verlet">Velocity Verlet</option>
          <option value="symplectic">Symplectic Euler</option>
          <option value="explicit">Explicit Euler</option>
        </select>
      </label>
    </div>
    <div id="chart"></div>
  </main>
  <script type="module" src="demo.js"></script>
</body>
</html>
