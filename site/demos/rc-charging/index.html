<!DOCTYPE html>
<html>
<head>
    <title>RC Charging Demo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; }
        .controls { display: grid; grid-template-columns: 100px 1fr; gap: 10px; align-items: center; margin-bottom: 20px; }
        canvas { border: 1px solid #ccc; width: 100%; height: 300px; }
        .readouts span { font-weight: bold; margin-right: 20px; }
    </style>
</head>
<body>
    <h1>RC Charging Circuit</h1>
    <div class="controls">
        <label>R (Ω):</label> <input type="range" id="resistor" min="10" max="1000" value="100">
        <label>C (F):</label> <input type="range" id="capacitor" min="0.001" max="1.0" step="0.001" value="0.1">
        <button id="toggle">Toggle Switch</button>
        <button id="reset">Reset Capacitor</button>
    </div>
    <div class="readouts">
        V_cap: <span id="vcap">0.0</span>
        I_cap: <span id="icap">0.0</span>
        &tau;: <span id="tau">0.0</span>
    </div>
    <canvas id="chart"></canvas>
    <script type="module" src="demo.js"></script>
</body>
</html>
