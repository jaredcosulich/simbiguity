<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Analogies - Simbiguity</title>
  <style>
    body { margin: 0; padding: 20px; font-family: sans-serif; background: #111; color: #eee; }
    .container { display: flex; flex-direction: row; gap: 20px; }
    .canvases { display: flex; flex-direction: row; gap: 10px; }
    canvas { background: #222; border: 1px solid #444; }
    .plot-container { position: relative; width: 600px; height: 300px; margin-top: 20px; }
    .plot-container canvas { width: 100%; height: 100%; position: absolute; top:0; left:0; }
    .plot-labels-overlay { pointer-events: none; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: left; }
    .panel { background: #1a1a1a; padding: 15px; border-radius: 8px; }
    label { display: block; margin-bottom: 5px; }
    input[type=range] { width: 100%; margin-bottom: 15px; }
  </style>
</head>
<body>
  <h1>Mechanical and Electrical Resonance</h1>
  <div class="container">
    <div class="panel">
      <h3>Controls</h3>
      <div id="controls"></div>
      
      <h3>Analogy Mapping</h3>
      <table>
        <thead><tr><th>Mechanical (Mass-Spring)</th><th>Electrical (Series RLC)</th><th>Value</th></tr></thead>
        <tbody id="mapping-tbody"></tbody>
      </table>
      <div style="margin-top:10px">
        Resonant ω₀ = <span id="val-w0"></span> rad/s<br>
        Quality factor Q = <span id="val-q"></span>
      </div>
    </div>
    
    <div>
      <div class="canvases">
        <div>
          <h3>Mass-Spring</h3>
          <canvas id="view-phys" width="300" height="300"></canvas>
        </div>
        <div>
          <h3>RLC Circuit</h3>
          <canvas id="view-circ" width="300" height="300"></canvas>
        </div>
      </div>
      
      <div class="plot-container" id="plot-box">
        <canvas id="view-plot" width="600" height="300"></canvas>
      </div>
    </div>
  </div>

  <script type="module" src="analogies.js"></script>
</body>
</html>
