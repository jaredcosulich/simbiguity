<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Isolated ScopeView</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #333; }
    #codeyam-capture { width: 600px; height: 200px; background: #111; padding: 10px; border-radius: 4px;}
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div id="codeyam-capture">
    <canvas id="scope-canvas" width="600" height="200"></canvas>
  </div>
  <script type="module">
    import { ScopeView } from "../../demos/circuit-lab/components/scope-view.js";

    const s = new URLSearchParams(window.location.search).get("s");
    const scope = new ScopeView(document.getElementById("scope-canvas"));
    
    if (s === "SineWave") {
      const data = [];
      for(let i=0; i<600; i+=2) {
         data.push(0, Math.sin(i / 50));
      }
      scope.draw(data);
    } else {
      scope.draw([]);
    }
  </script>
</body>
</html>
