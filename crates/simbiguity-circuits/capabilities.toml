# What simbiguity-circuits can do, which demo shows it, and which tests
# prove it. Read by `cargo run -p xtask -- site-report` for the engine
# status page (site/status/). A `proves` entry is a test module, or one
# test's full path; integration tests live under `tests/<file>`.

[[capability]]
name = "Circuits that change over time"
description = "Capacitors and inductors evaluated with backward Euler and trapezoidal integration to simulate transient responses."
demo = "demos/rc-charging/"
proves = [
  "tests/analysis::trapezoidal_rc_matches_hand_computed_discrete_answer",
  "tests/analysis::rc_circuit_charging_matches_exact_solution",
  "tests/analysis::lc_ringing_trapezoidal_preserves_energy",
  "tests/analysis::lc_ringing_backward_euler_decays_energy",
  "tests/analysis::rl_circuit_matches_exact_solution",
  "tests/analysis::rc_dc_limit_matches_solve",
  "tests/analysis::transient_snapshot_restore_replay_is_bit_identical"
]

[[capability]]
name = "Ohm's law, series and parallel"
description = "Current, voltage and power through resistors in series and in parallel, matching the hand calculation to nine decimal places."
demo = "demos/hello-circuit/#closed"
proves = [
  "tests/analysis::ohms_law_single_resistor",
  "tests/analysis::series_voltage_divider",
  "tests/analysis::parallel_resistors_share_current",
  "tests/analysis::wire_carries_the_loop_current",
]

[[capability]]
name = "Real batteries and bridge circuits"
description = "Internal resistance that sags the terminal voltage, balanced and unbalanced Wheatstone bridges, and batteries of different EMF fighting in parallel."
proves = [
  "tests/analysis::internal_resistance_sags_terminal_voltage",
  "tests/analysis::balanced_wheatstone_bridge_carries_no_bridge_current",
  "tests/analysis::unbalanced_wheatstone_bridge_carries_known_current",
  "tests/analysis::parallel_batteries_with_different_emfs_circulate_current",
]

[[capability]]
name = "Switches and bulb brightness"
description = "A switch opens and closes the loop, and a bulb's brightness follows the power it dissipates relative to its rating."
demo = "demos/hello-circuit/#closed&v=4"
proves = [
  "tests/analysis::switch_lights_a_bulb",
  "tests/analysis::bulb_brightness_scales_with_power",
  "tests/analysis::non_bulbs_have_no_brightness",
  "tests/analysis::switch_input_takes_effect_on_step",
]

[[capability]]
name = "Diagnostics a learner can understand"
description = "Short circuits, impossible values and floating parts are reported in plain language instead of producing a wrong number."
demo = "demos/hello-circuit/#closed&short"
proves = [
  "tests/analysis::ideal_battery_short_is_fatal",
  "tests/analysis::real_battery_short_reports_emf_over_r",
  "tests/analysis::parallel_ideal_batteries_are_a_voltage_source_loop",
  "tests/analysis::invalid_value_is_fatal",
  "tests/analysis::floating_island_is_reported_and_unmeasured",
  "diagnostics::tests",
]

[[capability]]
name = "Bulbs that blow"
description = "Overdrive a bulb and its filament burns out, opening the circuit, and it stays blown until it is replaced. In series, the most overloaded bulb goes first."
demo = "demos/hello-circuit/#closed&v=20"
proves = [
  "tests/analysis::overloaded_bulb_blows_and_opens_the_circuit",
  "tests/analysis::most_overloaded_series_bulb_blows_first_and_saves_the_other",
  "tests/analysis::blown_bulb_persists_until_replaced",
]

[[capability]]
name = "Modified Nodal Analysis solver"
description = "Netlists are built from components and wires, merged into nodes and solved as one linear system per connected island."
proves = [
  "mna::tests",
  "netlist::tests",
  "wires::tests",
  "dsu::tests",
  "component::tests",
]

[[capability]]
name = "Deterministic, snapshot-able simulation"
description = "The same circuit always solves to the same bits, and a snapshot restores a running simulation exactly."
proves = [
  "tests/analysis::snapshot_round_trip_restores_state",
  "tests/analysis::solving_is_deterministic",
]

[[capability]]
name = "Diodes and LEDs (nonlinear solving)"
description = "Newton-Raphson nonlinear solver for Shockley diode and LED components."
proves = [
  "tests/nonlinear::diode_with_1k_from_5v_drops_0_6925_volts",
  "tests/nonlinear::two_diodes_in_series",
  "tests/nonlinear::diode_reversed",
  "tests/nonlinear::led_with_160_ohm",
  "tests/nonlinear::led_with_330_ohm",
  "tests/nonlinear::led_direct_blows",
  "invariants_tests::kcl_with_diodes"
]
