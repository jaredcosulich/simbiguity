[package]
name = "xtask"
description = "Repository tooling for simbiguity. `cargo run -p xtask -- site-report` runs every test and writes the engine status page's report."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
simbiguity-circuits = { path = "../crates/simbiguity-circuits" }
simbiguity-circuits-view = { path = "../crates/simbiguity-circuits-view" }
simbiguity-math = { path = "../crates/simbiguity-math" }
simbiguity-core = { path = "../crates/simbiguity-core" }
simbiguity-physics = { path = "../crates/simbiguity-physics" }
